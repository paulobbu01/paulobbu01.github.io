<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pista Turbo 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas#gl, canvas#c { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  canvas#gl { z-index: 0; } canvas#c { z-index: 1; }
  .overlay { z-index: 5; }

  .hidden { display: none !important; }
  .card { width: min(92vw, 620px); max-height: 94vh; overflow-y: auto; box-sizing: border-box; background: linear-gradient(160deg, #1a1033, #2a0e2e); border: 3px solid #ff3d00; border-radius: 18px; padding: 16px; color: #fff; text-align: center; box-shadow: 0 0 40px rgba(255, 61, 0, .45); animation: pop .4s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  h1 { margin: 0; font-size: clamp(34px, 8vw, 58px); font-style: italic; font-weight: 900; letter-spacing: 1px; background: linear-gradient(#fff59d, #ff9100 55%, #ff3d00); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #4a0000) drop-shadow(0 0 14px rgba(255,145,0,.6)); }
  h2 { margin: 0 0 6px; font-size: 26px; color: #ffd740; font-style: italic; }
  p { margin: 6px 0; font-size: 14px; color: #ffe0b2; line-height: 1.4; }
  .btn { margin-top: 10px; width: 100%; border: 0; border-radius: 12px; padding: 13px; font-size: 19px; font-weight: 900; font-style: italic; color: #1a0000; background: linear-gradient(#ffd740, #ff9100); box-shadow: 0 4px 0 #b33c00; cursor: pointer; font-family: inherit; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b33c00; }
  .btn.alt { background: linear-gradient(#b39ddb, #7e57c2); color: #fff; box-shadow: 0 4px 0 #4527a0; font-size: 15px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .row2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .money { display: inline-block; background: rgba(0,230,118,.12); border: 2px solid #00e676; color: #b9f6ca; border-radius: 20px; padding: 4px 14px; font-weight: 900; margin: 4px 0; }
  .mini { background: rgba(255,255,255,.1); color: #fff; border: 1px solid #ff9100; border-radius: 20px; padding: 5px 12px; font-weight: 800; font-family: inherit; font-size: 13px; cursor: pointer; }
  .topRow { display: flex; justify-content: space-between; align-items: center; }
  .tracks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
  .trk { border: 2px solid #ff9100; border-radius: 12px; padding: 8px; color: #fff; font-family: inherit; cursor: pointer; font-weight: 900; font-size: 15px; min-height: 70px; text-shadow: 0 2px 2px #000; }
  .trk small { display: block; font-weight: 600; font-size: 11px; opacity: .9; }
  table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  td { padding: 3px 6px; border-bottom: 1px solid rgba(255,255,255,.08); text-align: left; }
  td:last-child { text-align: right; font-weight: 900; }
  tr.me td { color: #ffd740; font-weight: 900; background: rgba(255,215,64,.1); }
  .big { font-size: 56px; font-weight: 900; font-style: italic; color: #ffd740; margin: 0; text-shadow: 0 3px 0 #b33c00; }
  .ups { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
  .up { background: rgba(255,255,255,.06); border: 2px solid #ff9100; border-radius: 12px; padding: 8px; color: #fff; cursor: pointer; font-family: inherit; }
  .up b { display: block; font-size: 15px; }
  .up small { display: block; font-size: 11px; color: #ffcc80; }
  .up em { display: block; font-style: normal; font-weight: 900; color: #b9f6ca; margin-top: 3px; }
  .up.off { opacity: .5; }
  .vol { margin: 12px 0; text-align: left; }
  .vol label { display: flex; justify-content: space-between; font-weight: 800; margin-bottom: 4px; }
  .vol input { width: 100%; height: 30px; accent-color: #ff9100; }
  .keys { font-size: 12px; color: #bcaaa4; }
  .rot { color: #ffd740; font-weight: 800; }
  @media (max-height: 460px) {
    .card { padding: 10px 14px; } h1 { font-size: 36px; } h2 { font-size: 20px; }
    p { margin: 3px 0; font-size: 12px; } .btn { padding: 9px; font-size: 16px; margin-top: 6px; }
    .big { font-size: 40px; } .tracks { grid-template-columns: repeat(4, 1fr); } .ups { grid-template-columns: repeat(4, 1fr); }
  }
  .pickRow { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 6px 0; }
  .pickCar { font: 700 13px system-ui, sans-serif; color: #fff; background: #263238; border: 2px solid #455a64; border-radius: 10px; padding: 7px 10px; cursor: pointer; }
  .pickCar.on { border-color: #ffd740; background: #37474f; box-shadow: 0 0 10px #ffd74088; }
  .pickCol { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff4; cursor: pointer; }
  .pickCol.on { border-color: #ffd740; box-shadow: 0 0 10px #ffd740; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="c"></canvas>

<div id="menu" class="overlay">
  <div class="card">
    <div class="topRow"><button class="mini" id="langBtn"></button><div class="money">💰 <span class="moneyVal">0</span></div></div>
    <h1>PISTA TURBO 3D</h1>
    <p id="noGL" class="rot" style="display:none">⚠️ Seu aparelho não conseguiu abrir o modo 3D (WebGL).</p>
    <p data-t="intro"></p>
    <p class="rot" id="rotHint" data-t="rot"></p>
    <button class="btn" id="champBtn" data-t="champ"></button>
    <div class="row">
      <button class="btn alt" id="quickBtn" data-t="quick"></button>
      <button class="btn alt" id="garageBtn" data-t="garage"></button>
      <button class="btn alt" id="setBtn" data-t="sound"></button>
    </div>
    <p class="keys" data-t="keys"></p>
  </div>
</div>

<div id="trackSel" class="overlay hidden">
  <div class="card">
    <h2 data-t="pick"></h2>
    <div class="tracks" id="trackList"></div>
    <button class="btn alt" id="trackBack" data-t="back"></button>
  </div>
</div>

<div id="results" class="overlay hidden">
  <div class="card">
    <h2 id="resTitle"></h2>
    <p class="big" id="resPos"></p>
    <p id="resInfo"></p>
    <div class="money">💰 +<span id="resPrize">0</span></div>
    <div class="row2">
      <button class="btn alt" id="resGarage" data-t="garage"></button>
      <button class="btn" id="resNext"></button>
    </div>
    <table id="resTable"></table>
  </div>
</div>

<div id="garage" class="overlay hidden">
  <div class="card">
    <h2 data-t="garageT"></h2>
    <div class="money">💰 <span class="moneyVal">0</span></div>
    <div id="repairBox"></div>
    <button class="btn alt" id="revBtn" data-t="listen"></button>
    <div id="carPick"></div>
    <div class="ups" id="upList"></div>
    <button class="btn" id="garageBack" data-t="back"></button>
  </div>
</div>

<div id="settings" class="overlay hidden" style="z-index:8">
  <div class="card">
    <h2 data-t="soundT"></h2>
    <div class="vol"><label><span data-t="music"></span><b id="musVal"></b></label><input type="range" id="musRange" min="0" max="100" step="5"></div>
    <div class="vol"><label><span data-t="sfx"></span><b id="sfxVal"></b></label><input type="range" id="sfxRange" min="0" max="100" step="5"></div>
    <div class="row2"><button class="btn alt" id="muteBtn"></button><button class="btn alt" id="engBtn"></button></div>
    <button class="btn" id="setBack" data-t="back"></button>
  </div>
</div>

<script>
(() => {
  // ================= Base 3D =================
  const glc = document.getElementById('gl');
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const gl = glc.getContext('webgl', { antialias: true, alpha: false }) || glc.getContext('experimental-webgl');
  const RW = 512, RH = 288;
  const $ = id => document.getElementById(id);
  let W, H, DPR, sc, ox = 0, oy = 0, GW = 1, GH = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    const q = Math.min(DPR, 1.5); // 3D numa resolução um pouco menor pra ficar leve no celular
    GW = Math.round(W * q); GH = Math.round(H * q); glc.width = GW; glc.height = GH;
    sc = W / RW; ox = 0; oy = 0;
    $('rotHint').style.display = (H > W && 'ontouchstart' in window) ? 'block' : 'none';
  }
  window.addEventListener('resize', resize); resize();
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const lerp = (a, b, p) => a + (b - a) * p;
  const easeIn = (a, b, p) => a + (b - a) * p * p;
  const easeInOut = (a, b, p) => a + (b - a) * (-Math.cos(p * Math.PI) / 2 + 0.5);
  function hr(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

  // ================= Idiomas =================
  const TXT = {
    pt: {
      intro: 'Corra contra 11 pilotos em 4 pistas. Use o <b>NITRO</b> nas retas, ganhe dinheiro e melhore seu carro na garagem!',
      rot: '📱 Vire o celular de lado!', champ: '🏆 CAMPEONATO', quick: '🏁 CORRIDA', garage: '🔧 GARAGEM', sound: '🔊 SOM', back: 'VOLTAR',
      keys: 'Celular: ◀ ▶ pra virar (acelera sozinho), FREIO e NITRO. Computador: setas, espaço = nitro.',
      pick: 'ESCOLHA A PISTA', garageT: '🔧 GARAGEM', soundT: '🔊 SOM', music: '🎵 Música', sfx: '💥 Efeitos',
      mute: '🔇 SILENCIAR', unmute: '🔊 LIGAR', engOn: '🚗 MOTOR: SIM', engOff: '🚗 MOTOR: NÃO',
      pos: 'POS', lap: 'VOLTA', time: 'TEMPO', best: 'MELHOR', go: 'JÁ!', final: 'ÚLTIMA VOLTA!', brake: 'FREIO', nitro: 'NITRO',
      finished: 'CORRIDA TERMINADA!', place: '{n}º LUGAR', info: 'Tempo: {t} · Melhor volta: {b}', next: 'PRÓXIMA ▶', again: 'CORRER DE NOVO', menu: 'MENU',
      champEnd: '🏆 FIM DO CAMPEONATO', champWin: 'VOCÊ É O CAMPEÃO!', champPos: 'Você terminou em {n}º no campeonato', pts: 'pts',
      race: 'Corrida {n} de 4', lvl: 'nível', max: 'MÁXIMO', need: 'Falta dinheiro!', you: 'VOCÊ', wrong: 'FORA DA PISTA!',
      tMe: ['Tchau, {n}! 👋', 'Come poeira, {n}! 💨', 'Isso aí é carro ou geladeira, {n}? 🧊', 'Olha o retrovisor, {n}! 😎', 'Vai de bicicleta, {n}? 🚲', 'Fica pra próxima, {n}!', 'Aprende comigo, {n}! 🏎️', 'Segura essa, {n}!', 'Freou cedo demais, {n}! 😜', 'Licença, {n}, tô com pressa!', 'Até mais, lerdinho! 🐢', 'Buzina pra mim, {n}! 📯'],
      tRival: ['{n}: Fui! 😜', '{n}: Lerdinho! 🐢', '{n}: Vê se me alcança! 💨', '{n}: Hoje não, parceiro!', '{n}: Bem-vindo à poeira! 😎', '{n}: Volta pra autoescola! 🚗'],
      listen: '🔊 OUVIR O MOTOR', dmg: 'DANO', broken: 'MOTOR QUEBRADO!', hit: 'DANO +{n}%', repair: '🔧 CONSERTAR CARRO ({n}%) · 💰 {c}', repaired: 'Carro consertado!', noDmg: '✅ Carro sem dano', dmgInfo: 'Dano no carro: {n}%',
      ups: { armor: ['Blindagem', 'Batidas causam menos dano'], engine: ['Motor', 'Mais velocidade máxima'], turbo: ['Turbo', 'Acelera mais rápido'], tires: ['Pneus', 'Segura melhor nas curvas'], nitro: ['Nitro', '+1 nitro por corrida'] },
      tracks: [['PRAIA TROPICAL', 'Coqueiros e mar'], ['CÂNION DO DESERTO', 'Calor e subidas'], ['SERRA NEVADA', 'Neve e curvas fechadas'], ['CIDADE NEON', 'Corrida à noite']]
    },
    en: {
      intro: 'Race 11 drivers on 4 tracks. Use <b>NITRO</b> on the straights, win money and upgrade your car in the garage!',
      rot: '📱 Turn your phone sideways!', champ: '🏆 CHAMPIONSHIP', quick: '🏁 RACE', garage: '🔧 GARAGE', sound: '🔊 SOUND', back: 'BACK',
      keys: 'Phone: ◀ ▶ to steer (auto gas), BRAKE and NITRO. Computer: arrows, space = nitro.',
      pick: 'CHOOSE A TRACK', garageT: '🔧 GARAGE', soundT: '🔊 SOUND', music: '🎵 Music', sfx: '💥 Effects',
      mute: '🔇 MUTE', unmute: '🔊 UNMUTE', engOn: '🚗 ENGINE: ON', engOff: '🚗 ENGINE: OFF',
      pos: 'POS', lap: 'LAP', time: 'TIME', best: 'BEST', go: 'GO!', final: 'FINAL LAP!', brake: 'BRAKE', nitro: 'NITRO',
      finished: 'RACE FINISHED!', place: '{n}{s} PLACE', info: 'Time: {t} · Best lap: {b}', next: 'NEXT ▶', again: 'RACE AGAIN', menu: 'MENU',
      champEnd: '🏆 CHAMPIONSHIP OVER', champWin: 'YOU ARE THE CHAMPION!', champPos: 'You finished {n}{s} in the championship', pts: 'pts',
      race: 'Race {n} of 4', lvl: 'level', max: 'MAX', need: 'Not enough money!', you: 'YOU', wrong: 'OFF ROAD!',
      tMe: ['Bye, {n}! 👋', 'Eat my dust, {n}! 💨', 'Is that a car or a fridge, {n}? 🧊', 'Check your mirror, {n}! 😎', 'Need a bike, {n}? 🚲', 'Better luck next time, {n}!', 'Learn from the best, {n}! 🏎️', 'Too slow, {n}!', 'You braked too early, {n}! 😜', 'Excuse me, {n}, in a hurry!', 'See ya, slowpoke! 🐢', 'Honk if you see me, {n}! 📯'],
      tRival: ['{n}: Later! 😜', '{n}: Slowpoke! 🐢', '{n}: Catch me if you can! 💨', '{n}: Not today, buddy!', '{n}: Welcome to my dust! 😎', '{n}: Back to driving school! 🚗'],
      listen: '🔊 HEAR THE ENGINE', dmg: 'DAMAGE', broken: 'ENGINE BROKEN!', hit: 'DAMAGE +{n}%', repair: '🔧 REPAIR CAR ({n}%) · 💰 {c}', repaired: 'Car repaired!', noDmg: '✅ No damage', dmgInfo: 'Car damage: {n}%',
      ups: { armor: ['Armor', 'Crashes cause less damage'], engine: ['Engine', 'Higher top speed'], turbo: ['Turbo', 'Faster acceleration'], tires: ['Tires', 'Better grip in turns'], nitro: ['Nitro', '+1 nitro per race'] },
      tracks: [['TROPICAL BEACH', 'Palm trees and sea'], ['DESERT CANYON', 'Heat and hills'], ['SNOWY RIDGE', 'Snow and tight turns'], ['NEON CITY', 'Night race']]
    }
  };
  let lang = 'pt';
  try { lang = localStorage.getItem('turboLang') || ((navigator.language || 'pt').toLowerCase().startsWith('pt') ? 'pt' : 'en'); } catch (e) {}
  const ord = n => lang === 'pt' ? '' : (n % 10 === 1 && n !== 11 ? 'st' : n % 10 === 2 && n !== 12 ? 'nd' : n % 10 === 3 && n !== 13 ? 'rd' : 'th');
  function t(k, v) { let s = TXT[lang][k] !== undefined ? TXT[lang][k] : TXT.pt[k]; if (typeof s === 'string' && v) for (const q in v) s = s.split('{' + q + '}').join(v[q]); return s; }
  function applyLang() {
    document.querySelectorAll('[data-t]').forEach(el => el.innerHTML = t(el.getAttribute('data-t')));
    $('langBtn').textContent = lang === 'pt' ? '🇺🇸 English' : '🇧🇷 Português';
  }

  // ================= Progresso salvo =================
  let save = { money: 0, up: { engine: 0, turbo: 0, tires: 0, nitro: 0, armor: 0 }, best: [0, 0, 0, 0], snd: { music: 0.2, sfx: 1, mute: false, engine: true }, musV2: true };
  try { const v = JSON.parse(localStorage.getItem('turboSave') || 'null'); if (v) { save = Object.assign(save, v); save.up = Object.assign({ engine: 0, turbo: 0, tires: 0, nitro: 0, armor: 0 }, v.up || {}); save.snd = Object.assign({ music: 0.2, sfx: 1, mute: false, engine: true }, v.snd || {}); if (!v.musV2) { save.snd.music = Math.min(save.snd.music, 0.2); save.musV2 = true; } } } catch (e) {}
  const persist = () => { try { localStorage.setItem('turboSave', JSON.stringify(save)); } catch (e) {} };
  const refreshMoney = () => document.querySelectorAll('.moneyVal').forEach(e => e.textContent = save.money.toLocaleString());

  // ================= Som e música =================
  let ac = null, master, musicGain, sfxGain, noiseBuf, eng = null;
  function audio() {
    try {
      if (!ac) {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.connect(ac.destination);
        musicGain = ac.createGain(); musicGain.connect(master);
        sfxGain = ac.createGain(); sfxGain.connect(master);
        noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.6, ac.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        applyVol();
      }
      if (ac.state === 'suspended') ac.resume();
    } catch (e) {}
  }
  function applyVol() {
    if (!ac) return;
    master.gain.setTargetAtTime(save.snd.mute ? 0 : 1, ac.currentTime, 0.03);
    musicGain.gain.setTargetAtTime(save.snd.music, ac.currentTime, 0.03);
    sfxGain.gain.setTargetAtTime(save.snd.sfx, ac.currentTime, 0.03);
  }
  function tone(f, dur, type, vol, slide) {
    if (!ac) return;
    try { const o = ac.createOscillator(), gg = ac.createGain(), tt = ac.currentTime; o.type = type || 'square'; o.frequency.setValueAtTime(f, tt); if (slide) o.frequency.exponentialRampToValueAtTime(slide, tt + dur); gg.gain.setValueAtTime(vol || 0.05, tt); gg.gain.exponentialRampToValueAtTime(0.0001, tt + dur); o.connect(gg); gg.connect(sfxGain); o.start(tt); o.stop(tt + dur); } catch (e) {}
  }
  function noise(dur, vol, type, freq, dest, at) {
    if (!ac) return;
    try { const s = ac.createBufferSource(), gg = ac.createGain(), f = ac.createBiquadFilter(), tt = at || ac.currentTime; s.buffer = noiseBuf; f.type = type; f.frequency.setValueAtTime(freq, tt); gg.gain.setValueAtTime(vol, tt); gg.gain.exponentialRampToValueAtTime(0.0001, tt + dur); s.connect(f); f.connect(gg); gg.connect(dest || sfxGain); s.start(tt, Math.random() * 0.3); s.stop(tt + dur); } catch (e) {}
  }
  // ---- motor de carro de corrida: muda a cada nível de motor e turbo comprado ----
  function makeDistortion(k) { const n = 2048, c = new Float32Array(n); for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; c[i] = (3 + k) * x * 20 * Math.PI / 180 / (Math.PI + k * Math.abs(x)); } return c; }
  function engProfile(lvl, turbo) {
    // nível 0 = carro de rua · nível 5 = motor de Fórmula (bem agudo e gritado)
    return {
      idle: 70 + lvl * 6,             // marcha lenta
      top: 250 + lvl * 42,            // giro máximo
      dist: 18 + lvl * 18,            // aspereza
      scream: lvl * 2.2,              // brilho agudo
      harm: 0.25 + lvl * 0.12,        // harmônico extra
      vol: 0.045 + lvl * 0.004,
      whistle: turbo > 0 ? 0.003 + turbo * 0.0025 : 0,
      pops: 0.08 + lvl * 0.04
    };
  }
  function engineOn(lvlOverride) {
    if (!ac || eng) return;
    const lvl = lvlOverride !== undefined ? lvlOverride : save.up.engine, P = engProfile(lvl, save.up.turbo);
    const o1 = ac.createOscillator(), o2 = ac.createOscillator(), o3 = ac.createOscillator(), o4 = ac.createOscillator();
    const lfo = ac.createOscillator(), lfoG = ac.createGain(), mix = ac.createGain();
    const dist = ac.createWaveShaper(), res = ac.createBiquadFilter(), hs = ac.createBiquadFilter(), lp = ac.createBiquadFilter(), gg = ac.createGain();
    const wh = ac.createOscillator(), whG = ac.createGain();
    o1.type = 'sawtooth'; o2.type = 'square'; o3.type = 'sawtooth'; o4.type = 'triangle';
    o3.detune.value = 7;
    const g2 = ac.createGain(), g3 = ac.createGain(), g4 = ac.createGain();
    g2.gain.value = 0.45; g3.gain.value = P.harm; g4.gain.value = 0.5;
    o1.connect(mix); o2.connect(g2); g2.connect(mix); o3.connect(g3); g3.connect(mix); o4.connect(g4); g4.connect(mix);
    lfo.type = 'square'; lfoG.gain.value = 0.3; lfo.connect(lfoG); lfoG.connect(mix.gain); mix.gain.value = 0.55; // batida dos cilindros
    dist.curve = makeDistortion(P.dist); dist.oversample = '4x';
    res.type = 'bandpass'; res.Q.value = 1.4; res.frequency.value = 900;           // ressonância do escapamento
    hs.type = 'highshelf'; hs.frequency.value = 2500; hs.gain.value = P.scream;     // "grito" do motor de corrida
    lp.type = 'lowpass'; lp.frequency.value = 6000;
    const dry = ac.createGain(); dry.gain.value = 0.7;
    mix.connect(dist); dist.connect(dry); dist.connect(res); dry.connect(hs); res.connect(hs); hs.connect(lp); lp.connect(gg); gg.connect(sfxGain);
    gg.gain.value = 0;
    wh.type = 'sine'; whG.gain.value = 0; wh.connect(whG); whG.connect(sfxGain);
    [o1, o2, o3, o4, lfo, wh].forEach(o => o.start());
    eng = { o1, o2, o3, o4, lfo, res, lp, gg, wh, whG, P, gear: 0, lastGas: false, crackleT: 0 };

    $('muteBtn').textContent = save.snd.mute ? t('unmute') : t('mute'); $('engBtn').textContent = save.snd.engine ? t('engOn') : t('engOff');
  }
  function openSettings() { audio(); if (state === 'race') { paused = true; pausedBySet = true; } refreshSettings(); $('settings').classList.remove('hidden'); }
  $('setBtn').addEventListener('click', () => { openSettings(); if (!song) setSong('menu'); });
  $('setBack').addEventListener('click', () => { $('settings').classList.add('hidden'); if (pausedBySet) { paused = false; pausedBySet = false; } });
  $('musRange').addEventListener('input', e => { save.snd.music = e.target.value / 100; save.snd.mute = false; applyVol(); persist(); refreshSettings(); });
  $('sfxRange').addEventListener('input', e => { save.snd.sfx = e.target.value / 100; save.snd.mute = false; applyVol(); persist(); refreshSettings(); });
  $('sfxRange').addEventListener('change', () => { tone(660, 0.1, 'square', 0.05); noise(0.3, 0.2, 'lowpass', 800); });
  $('muteBtn').addEventListener('click', () => { save.snd.mute = !save.snd.mute; applyVol(); persist(); refreshSettings(); });
  $('engBtn').addEventListener('click', () => { save.snd.engine = !save.snd.engine; persist(); refreshSettings(); });
  $('langBtn').addEventListener('click', () => { lang = lang === 'pt' ? 'en' : 'pt'; try { localStorage.setItem('turboLang', lang); } catch (e) {} applyLang(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'race') { paused = true; } else if (!document.hidden && !pausedBySet) paused = false; });

  // ================= Loop principal =================
  applyLang(); refreshMoney();
  if (!gl) { $('noGL').style.display = 'block'; }
  function menuDrive(dt) {
    if (!path.length) { trackIdx = 0; track = TRACKS[0]; buildTrack(0); }
    position = increase(position, dt * BASE_MAX * 0.42, trackLength); playerX = Math.sin(time * 0.4) * 0.35; speed = BASE_MAX * 0.42;
    cars.forEach(c => { c.z = increase(c.z, dt * BASE_MAX * 0.4, trackLength); });
    updateParticles(dt);
  }
  // acabamento de cinema: reflexo do sol na lente, vinheta e borrão de velocidade
  let vig = null, vigW = 0, vigH = 0;
  function post() {
    if (!gl) return;
    if (sunScreen) {
      const [sx, sy, k] = sunScreen, cx = W / 2, cy = H / 2;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, H * 0.55); g.addColorStop(0, `rgba(255,240,200,${0.45 * k})`); g.addColorStop(1, 'rgba(255,240,200,0)');
      ctx.fillStyle = g; ctx.fillRect(sx - H * 0.55, sy - H * 0.55, H * 1.1, H * 1.1);
      [[0.35, 0.05, '255,200,120'], [0.7, 0.03, '140,200,255'], [1.25, 0.07, '255,150,220'], [1.6, 0.025, '160,255,190']].forEach(([t, r, c]) => {
        const x = sx + (cx - sx) * t * 2 / 2 * 2 / 1, y = sy + (cy - sy) * t * 2 / 2 * 2 / 1, rr = H * r * 2;
        ctx.fillStyle = `rgba(${c},${0.16 * k})`; ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2); ctx.fill(); });
      ctx.restore();
    }
    if (!vig || vigW !== W || vigH !== H) {
      vigW = W; vigH = H; vig = document.createElement('canvas'); vig.width = Math.max(1, W / 2 | 0); vig.height = Math.max(1, H / 2 | 0);
      const v = vig.getContext('2d'), w = vig.width, h = vig.height, g = v.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.hypot(w, h) * 0.55);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.42)'); v.fillStyle = g; v.fillRect(0, 0, w, h);
    }
    ctx.drawImage(vig, 0, 0, W, H);
    // linhas de velocidade no turbo
    if (state === 'race' && nitroT > 0) {
      ctx.save(); ctx.strokeStyle = 'rgba(200,235,255,0.35)'; ctx.lineWidth = 2; const cx = W / 2, cy = H * 0.45;
      for (let i = 0; i < 18; i++) { const a = Math.random() * Math.PI * 2, r1 = Math.min(W, H) * (0.45 + Math.random() * 0.3), r2 = r1 + 40 + Math.random() * 80;
        ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1 * 0.7); ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2 * 0.7); ctx.stroke(); }
      ctx.restore();
    }
  }
  let last = performance.now(), acc = 0;
  function frame(now) {
    let dt = (now - last) / 1000; last = now; if (dt > 0.1) dt = 0.1;
    if (state === 'race') { if (!paused) { acc += dt; while (acc >= STEP) { update(STEP); acc -= STEP; } } }
    else { time += dt; menuDrive(dt); }
    try { render3D(dt); } catch (e) { console.error(e); }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
    post();
    if (state === 'race') hud();
    if (paused && state === 'race') { ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, H); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
