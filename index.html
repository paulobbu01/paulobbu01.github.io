<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Patrulha Galáctica</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas#c { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(2, 4, 20, .72); z-index: 5; }
  .overlay.hidden { display: none; }
  .card { width: min(92vw, 560px); max-height: 94vh; overflow-y: auto; box-sizing: border-box; background: linear-gradient(160deg, #10163a, #1d0f3a); border: 2px solid #3d5afe; border-radius: 18px; padding: 18px; color: #e8eaf6; text-align: center; box-shadow: 0 0 40px rgba(61, 90, 254, .45); animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  h1 { margin: 0; font-size: clamp(28px, 7vw, 44px); letter-spacing: 1px; background: linear-gradient(#80d8ff, #ea80fc); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 10px rgba(128,216,255,.6)); }
  h2 { margin: 0 0 6px; font-size: 28px; color: #ff80ab; }
  p { margin: 6px 0; font-size: 14px; line-height: 1.4; color: #c5cae9; }
  .btn { margin-top: 12px; width: 100%; border: 0; border-radius: 12px; padding: 14px; font-size: 19px; font-weight: 900; color: #0b0b2a; background: linear-gradient(#69f0ae, #00e676); box-shadow: 0 4px 0 #00a152; cursor: pointer; font-family: inherit; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #00a152; }
  .rot { color: #ffd740; font-weight: 800; }
  .stat { font-size: 40px; font-weight: 900; color: #fff; }
  .crys { display: inline-block; background: rgba(0,229,255,.12); border: 1px solid #00e5ff; color: #84ffff; border-radius: 20px; padding: 4px 14px; font-weight: 900; margin: 6px 0; }
  #ups { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .up { background: rgba(255,255,255,.06); border: 2px solid #3949ab; border-radius: 12px; padding: 8px 4px; color: #e8eaf6; cursor: pointer; font-family: inherit; }
  .up b { display: block; font-size: 22px; }
  .up span { display: block; font-size: 12px; font-weight: 800; margin-top: 2px; }
  .up small { display: block; font-size: 11px; color: #9fa8da; margin-top: 2px; min-height: 26px; }
  .up em { display: block; font-style: normal; font-weight: 900; color: #84ffff; margin-top: 3px; font-size: 13px; }
  .up.off { opacity: .45; }
  .up.max em { color: #69f0ae; }
  .keys { font-size: 12px; color: #7986cb; }
  #settings { z-index: 8; }
  #hangar, #missions, #daily { z-index: 7; }
  .hidden { display: none !important; }
  .topRow { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .mini { background: rgba(255,255,255,.1); color: #e8eaf6; border: 1px solid #5c6bc0; border-radius: 20px; padding: 5px 12px; font-weight: 800; font-family: inherit; font-size: 13px; cursor: pointer; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .row3 .btn { font-size: 13px; padding: 10px 4px; position: relative; }
  .btn.ad { background: linear-gradient(#ffd740, #ffab00); box-shadow: 0 4px 0 #c67c00; font-size: 16px; padding: 11px; }
  .badge { position: absolute; top: -6px; right: -4px; background: #ff1744; color: #fff; border-radius: 10px; font-style: normal; font-size: 12px; padding: 1px 7px; animation: pulse 1s infinite; }
  h3 { margin: 12px 0 4px; font-size: 15px; color: #84ffff; letter-spacing: 1px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .shipC, .perkC { background: rgba(255,255,255,.06); border: 2px solid #3949ab; border-radius: 12px; padding: 6px; color: #e8eaf6; font-family: inherit; cursor: pointer; }
  .shipC canvas { width: 72px; height: 72px; display: block; margin: 0 auto; }
  .shipC b, .perkC b { display: block; font-size: 14px; }
  .shipC small, .perkC small { display: block; font-size: 11px; color: #9fa8da; min-height: 28px; }
  .shipC em, .perkC em { display: block; font-style: normal; font-weight: 900; font-size: 13px; color: #84ffff; margin-top: 2px; }
  .shipC.sel { border-color: #00e676; background: rgba(0,230,118,.12); }
  .shipC.sel em { color: #69f0ae; }
  .off { opacity: .5; }
  .mis { background: rgba(255,255,255,.06); border: 2px solid #3949ab; border-radius: 12px; padding: 10px; margin: 8px 0; text-align: left; }
  .mis .t { font-weight: 800; font-size: 14px; }
  .mis .bar { height: 8px; background: rgba(255,255,255,.12); border-radius: 4px; margin: 6px 0; overflow: hidden; }
  .mis .bar i { display: block; height: 100%; background: linear-gradient(90deg, #00e5ff, #69f0ae); }
  .mis .ft { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #9fa8da; }
  .mis button { background: linear-gradient(#69f0ae, #00e676); border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 900; font-family: inherit; cursor: pointer; }
  .mis.done { border-color: #00e676; }
  .mis.claimed { opacity: .55; }
  .small { font-size: 12px !important; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 10px 0; }
  .days div { background: rgba(255,255,255,.07); border: 2px solid #3949ab; border-radius: 8px; padding: 6px 0; font-size: 11px; font-weight: 800; }
  .days div.on { border-color: #ffd740; background: rgba(255,215,64,.18); }
  .days div.past { opacity: .45; }
  .earned { color: #84ffff !important; font-weight: 800; }
  #toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 20; background: rgba(16,22,58,.95); border: 2px solid #00e676; color: #fff; border-radius: 14px; padding: 10px 16px; font-weight: 800; font-size: 14px; box-shadow: 0 0 20px rgba(0,230,118,.4); animation: pop .35s; max-width: 86vw; text-align: center; }

  .btn.alt { background: linear-gradient(#9fa8da, #7986cb); box-shadow: 0 4px 0 #3949ab; font-size: 16px; padding: 10px; }
  .vol { margin: 14px 0; text-align: left; }
  .vol label { display: flex; justify-content: space-between; font-weight: 800; font-size: 15px; color: #e8eaf6; margin-bottom: 6px; }
  .vol label b { color: #84ffff; }
  .vol input[type=range] { width: 100%; height: 34px; accent-color: #00e5ff; }
  .muteRow { display: flex; gap: 8px; }
  .muteRow .btn { margin-top: 6px; }
  @media (max-height: 520px) {
    .card { padding: 10px 14px; }
    h1 { font-size: 30px; } h2 { font-size: 22px; margin: 0; }
    p { margin: 3px 0; font-size: 13px; }
    .btn { margin-top: 8px; padding: 10px; font-size: 17px; }
    #ups { grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 4px; }
    .up { padding: 4px 2px; } .up b { font-size: 18px; } .up small { display: none; }
    .crys { margin: 2px 0; padding: 2px 12px; }
    .stat { font-size: 30px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu" class="overlay">
  <div class="card">
    <div class="topRow"><button class="mini" id="langBtn">🇺🇸 English</button><div class="crys">💎 <span class="bankVal">0</span></div></div>
    <h1>PATRULHA GALÁCTICA</h1>
    <p data-t="how1"></p>
    <p data-t="how2"></p>
    <p class="rot" id="rotHint" data-t="rot"></p>
    <p><span data-t="best"></span>: <b id="bestMenu">0</b></p>
    <button class="btn" id="playBtn" data-t="play"></button>
    <button class="btn ad hidden" id="boostBtn" data-t="boost"></button>
    <div class="row3">
      <button class="btn alt" id="hangarBtn" data-t="hangar"></button>
      <button class="btn alt" id="missBtn"><span data-t="missions"></span><i class="badge hidden" id="missBadge">!</i></button>
      <button class="btn alt" id="setBtn1" data-t="sound"></button>
    </div>
    <p class="keys" data-t="keys"></p>
  </div>
</div>

<div id="hangar" class="overlay hidden">
  <div class="card">
    <h2 data-t="hangarT"></h2>
    <div class="crys">💎 <span class="bankVal">0</span> <span data-t="crystals"></span></div>
    <h3 data-t="ships"></h3>
    <div id="shipGrid" class="grid2"></div>
    <h3 data-t="perks"></h3>
    <div id="perkGrid" class="grid2"></div>
    <button class="btn" id="hangarBack" data-t="back"></button>
  </div>
</div>

<div id="missions" class="overlay hidden">
  <div class="card">
    <h2 data-t="missionsT"></h2>
    <p class="small" data-t="missionsSub"></p>
    <div id="missList"></div>
    <button class="btn" id="missBack" data-t="back"></button>
  </div>
</div>

<div id="daily" class="overlay hidden">
  <div class="card">
    <h2 data-t="dailyT"></h2>
    <p id="dailySub"></p>
    <div id="dailyDays" class="days"></div>
    <button class="btn" id="dailyBtn"></button>
  </div>
</div>

<div id="settings" class="overlay hidden">
  <div class="card">
    <h2 data-t="soundT"></h2>
    <div class="vol"><label><span data-t="music"></span> <b id="musVal">55%</b></label><input type="range" id="musRange" min="0" max="100" step="5"></div>
    <div class="vol"><label><span data-t="sfx"></span> <b id="sfxVal">100%</b></label><input type="range" id="sfxRange" min="0" max="100" step="5"></div>
    <div class="muteRow"><button class="btn alt" id="muteBtn"></button><button class="btn alt" id="vibBtn"></button></div>
    <button class="btn" id="setBack" data-t="back"></button>
  </div>
</div>

<div id="upgrade" class="overlay hidden">
  <div class="card">
    <h2 id="upTitle"></h2>
    <p id="upSub"></p>
    <div class="crys">💎 <span class="bankVal">0</span> <span data-t="crystals"></span></div>
    <button class="btn ad hidden" id="doubleBtn"></button>
    <div id="ups"></div>
    <button class="btn" id="nextBtn" data-t="next"></button>
    <button class="btn alt" id="setBtn3" data-t="sound"></button>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="card">
    <h2 data-t="overT"></h2>
    <p data-t="points"></p>
    <div class="stat" id="finalScore">0</div>
    <p id="overInfo"></p>
    <p id="bestOver"></p>
    <p class="earned" id="earnedLine"></p>
    <button class="btn ad hidden" id="reviveBtn" data-t="revive"></button>
    <button class="btn" id="againBtn" data-t="again"></button>
    <div class="row3">
      <button class="btn alt" id="hangarBtn2" data-t="hangar"></button>
      <button class="btn alt" id="menuBtn" data-t="menu"></button>
      <button class="btn alt" id="setBtn2" data-t="sound"></button>
    </div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>

  try { lang = localStorage.getItem('patrulhaLang') || ((navigator.language || 'pt').toLowerCase().startsWith('pt') ? 'pt' : 'en'); } catch (e) {}

    let s = (TXT[lang] && TXT[lang][k] !== undefined) ? TXT[lang][k] : TXT.pt[k];
    if (typeof s === 'string' && vars) for (const v in vars) s = s.split('{' + v + '}').join(vars[v]);
    return s;
  }
  function applyLang() {
    document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
    document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = t(el.getAttribute('data-t')); });
    const lb = document.getElementById('langBtn'); if (lb) lb.textContent = lang === 'pt' ? '🇺🇸 English' : '🇧🇷 Português';

    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    // a altura do jogo se ajusta ao formato da tela (celular comprido ganha mais espaço)
    SH = Math.round(Math.max(560, Math.min(780, 360 * H / W))); VW = SH;
    scale = Math.min(W / SW, H / SH);
    offX = (W - SW * scale) / 2; offY = (H - SH * scale) / 2;

    $('rotHint').style.display = (W > H * 1.2 && 'ontouchstart' in window) ? 'block' : 'none';

  window.addEventListener('resize', resize);

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const dist2 = (a, b, c, d) => (a - c) * (a - c) + (b - d) * (b - d);

  function dayKey(d) { d = d || new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function ensureMissions() {
    const today = dayKey();
    if (save.missions && save.missions.date === today) return;
    let seed = 0; for (const ch of today) seed = seed * 31 + ch.charCodeAt(0);
    const R = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const ids = Object.keys(MISSION_POOL).sort(() => R() - 0.5).slice(0, 3);
    save.missions = { date: today, list: ids.map(id => ({ id, lv: Math.floor(R() * 3), prog: 0, claimed: false })) };
    persist();
  }
  function mission(id, val, isMax) {
    if (!save.missions) return;
    save.missions.list.forEach(m => {
      if (m.id !== id || m.claimed) return;
      const tg = MISSION_POOL[id].tg[m.lv], before = m.prog;
      m.prog = isMax ? Math.max(m.prog, val) : m.prog + val;
      if (before < tg && m.prog >= tg) { toast(t('missDone')); tone(660, 0.1, 'square', 0.04, 1320); saveTimer = 1; }
    });
    saveTimer = 1;
    refreshBadge();
  }
  function claimable() { return save.missions ? save.missions.list.filter(m => !m.claimed && m.prog >= MISSION_POOL[m.id].tg[m.lv]).length : 0; }
  function refreshBadge() { const n = claimable(); const b = $('missBadge'); if (b) { b.textContent = n; b.classList.toggle('hidden', !n); } }

    save.missions.list.forEach(m => {

      d.innerHTML = `<div class="t">${txt}</div><div class="bar"><i style="width:${Math.min(100, m.prog / tg * 100)}%"></i></div>
        <div class="ft"><span>${Math.min(m.prog, tg).toLocaleString()} / ${tg.toLocaleString()} · ${t('reward')}: 💎 ${P0.rw[m.lv]}</span>${m.claimed ? '<span>' + t('claimed') + '</span>' : done ? '<button>' + t('claim') + '</button>' : ''}</div>`;

  function checkDaily() {
    const today = dayKey();
    if (save.lastLogin === today) return;
    const y = new Date(); y.setDate(y.getDate() - 1);
    const streak = save.lastLogin === dayKey(y) ? (save.streak % 7) + 1 : 1;
    const reward = DAILY[streak - 1];
    $('dailySub').textContent = t('dailySub', { d: streak });
    const box = $('dailyDays'); box.innerHTML = '';
    DAILY.forEach((r, i) => { const d = document.createElement('div'); d.className = i + 1 === streak ? 'on' : i + 1 < streak ? 'past' : ''; d.innerHTML = `${t('day')} ${i + 1}<br>💎${r}`; box.appendChild(d); });
    $('dailyBtn').textContent = t('dailyBtn', { n: reward });
    $('dailyBtn').onclick = () => {
      save.lastLogin = today; save.streak = streak; save.bank += reward; persist(); refreshBank();
      $('daily').classList.add('hidden'); audio(); [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.12, 'triangle', 0.05), i * 90));
    };
    $('daily').classList.remove('hidden');
  }

  // ---------- Anúncios (CrazyGames) ----------
  let sdk = null, adsOn = false, adPlaying = false, lastMidgame = 0, gpOn = false;
  async function initSDK() {
    try {
      const S = window.CrazyGames && window.CrazyGames.SDK;
      if (!S) return;
      if (S.init) await S.init();
      sdk = S;
      let env = S.environment;
      if (!env && S.getEnvironment) env = await S.getEnvironment();
      adsOn = env === 'crazygames' || env === 'local';
      try { S.game && S.game.loadingStop && S.game.loadingStop(); } catch (e) {}
    } catch (e) { adsOn = false; }
    refreshAdButtons();
  }
  function refreshAdButtons() {
    $('boostBtn').classList.toggle('hidden', !adsOn);
    $('reviveBtn').classList.toggle('hidden', !adsOn || revived || state !== 'over');
    $('doubleBtn').classList.toggle('hidden', !adsOn || doubled || stageCrystals <= 0);
  }
  function showAd(type, onReward, onDone) {
    if (!adsOn || !sdk || adPlaying) { onDone && onDone(false); return; }
    adPlaying = true;
    if (master) master.gain.setTargetAtTime(0, ac.currentTime, 0.02);
    const end = ok => {
      adPlaying = false; last = performance.now();
      if (master) master.gain.setTargetAtTime(muted ? 0 : 1, ac.currentTime, 0.05);
      if (ok && type === 'rewarded' && onReward) onReward();
      if (!ok && type === 'rewarded') toast(t('adFail'));
      if (type === 'midgame') lastMidgame = Date.now();
      onDone && onDone(ok);
    };
    try { sdk.ad.requestAd(type, { adStarted: () => {}, adFinished: () => end(true), adError: () => end(false) }); }
    catch (e) { end(false); }
  }
  function maybeMidgame(then) {
    if (adsOn && Date.now() - lastMidgame > 150000) showAd('midgame', null, () => then());
    else then();
  }
  function syncGameplay() {
    const on = state === 'play' && !paused && !adPlaying;
    if (on === gpOn || !sdk || !sdk.game) return;
    gpOn = on;
    try { on ? sdk.game.gameplayStart() : sdk.game.gameplayStop(); } catch (e) {}
  }

  // ---------- Tutorial (só na primeira vez) ----------
  let tutStep = 0, tutTimer = 0, tutMoved = 0;
  function drawTutorial() {
    if (save.tut || stage !== 0 || loop !== 0 || state !== 'play') return;
    const dt = 1 / 60;
    let msg = '', arrowTo = null;
    if (tutStep === 0) { msg = t('tut0'); if (tutMoved > 90) { tutStep = 1; tutTimer = 2.8; } }
    else if (tutStep === 1) { msg = t('tut1'); tutTimer -= dt; if (tutTimer <= 0) tutStep = 2; }
    else if (tutStep === 2) { if (pickups.length) { msg = t('tut2'); const p = toS(pickups[0].x, pickups[0].y); arrowTo = p; } if (stageTime > 22 || (pickups.length === 0 && ups.power > 1)) { tutStep = 3; tutTimer = 4; } }
    else if (tutStep === 3) { msg = t('tut3'); arrowTo = { x: BOMB_BTN.x, y: BOMB_BTN.y }; tutTimer -= dt; if (tutTimer <= 0) { tutStep = 4; save.tut = true; persist(); } }
    if (!msg) return;
    const y = SH * 0.58;
    ctx.font = '800 14px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const w = ctx.measureText(msg).width + 28;
    ctx.globalAlpha = 0.85 + Math.sin(time * 5) * 0.1;
    ctx.fillStyle = 'rgba(10,14,40,.85)'; ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(SW / 2 - w / 2, y - 18, w, 36, 12) : ctx.rect(SW / 2 - w / 2, y - 18, w, 36); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.fillText(msg, SW / 2, y);
    if (tutStep === 0) { // mãozinha mexendo
      const hx = SW / 2 + Math.sin(time * 3) * 60, hy = y + 60;
      ctx.font = '30px system-ui'; ctx.fillText('👆', hx, hy);
      ctx.strokeStyle = 'rgba(0,229,255,.5)'; ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.moveTo(SW / 2 - 60, hy + 22); ctx.lineTo(SW / 2 + 60, hy + 22); ctx.stroke(); ctx.setLineDash([]);
    }
    if (arrowTo) {
      ctx.strokeStyle = '#ffd740'; ctx.lineWidth = 3; ctx.setLineDash([6, 6]); ctx.lineDashOffset = -time * 30;
      ctx.beginPath(); ctx.moveTo(SW / 2, y + 18); ctx.lineTo(arrowTo.x, arrowTo.y); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(arrowTo.x, arrowTo.y, 26 + Math.sin(time * 8) * 4, 0, 6.29); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Hangar ----------
  const SHIPS = [{ id: 'falcon', cost: 0 }, { id: 'vespa', cost: 400 }, { id: 'tita', cost: 800 }, { id: 'fenix', cost: 1500 }];
  const PERKS = [
    { id: 'power', max: 2, cost: l => [200, 450][l] },
    { id: 'life', max: 2, cost: l => [300, 650][l] },
    { id: 'bomb', max: 2, cost: l => [120, 260][l] },
    { id: 'magnet', max: 4, cost: l => 150 * (l + 1) }
  ];
  function shipPreview(id) {
    const c = document.createElement('canvas'); c.width = 144; c.height = 144;
    const g = c.getContext('2d');
    ctx = g; g.translate(72, 80); g.rotate(-Math.PI / 2); g.scale(2.2, 2.2);
    try { drawShip(0, 0, 0, 1, id, 3); } catch (e) {}
    ctx = mainCtx;
    return c;
  }
  function renderHangar() {
    refreshBank();
    const sg = $('shipGrid'); sg.innerHTML = '';
    SHIPS.forEach(sh => {
      const has = save.ships.includes(sh.id), sel = save.ship === sh.id;
      const b = document.createElement('button');
      b.className = 'shipC' + (sel ? ' sel' : '') + (!has && save.bank < sh.cost ? ' off' : '');
      b.appendChild(shipPreview(sh.id));
      const [nm, ds] = t('shipN')[sh.id];
      b.insertAdjacentHTML('beforeend', `<b>${nm}</b><small>${ds}</small><em>${sel ? t('using') : has ? t('use') : '💎 ' + sh.cost}</em>`);
      b.addEventListener('click', () => {
        if (has) { save.ship = sh.id; persist(); tone(660, 0.08, 'square', 0.04); }
        else if (spend(sh.cost)) { save.ships.push(sh.id); save.ship = sh.id; persist(); [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.12, 'square', 0.04), i * 90)); }
        else { toast(t('notEnough', { n: sh.cost - save.bank })); tone(150, 0.15, 'sawtooth', 0.03); return; }
        renderHangar();
      });
      sg.appendChild(b);
    });
    const pg = $('perkGrid'); pg.innerHTML = '';
    PERKS.forEach(pk => {
      const l = save.perks[pk.id], maxed = l >= pk.max, cost = maxed ? 0 : pk.cost(l);
      const b = document.createElement('button');
      b.className = 'perkC' + (!maxed && save.bank < cost ? ' off' : '');
      const [nm, ds] = t('perkN')[pk.id];
      b.innerHTML = `<b>${nm} ${'●'.repeat(l)}${'○'.repeat(pk.max - l)}</b><small>${ds}</small><em>${maxed ? t('maxed') : '💎 ' + cost}</em>`;
      b.addEventListener('click', () => {
        if (maxed) return;
        if (!spend(cost)) { toast(t('notEnough', { n: cost - save.bank })); tone(150, 0.15, 'sawtooth', 0.03); return; }
        save.perks[pk.id]++; persist(); tone(660, 0.08, 'square', 0.04, 1320); renderHangar();
      });
      pg.appendChild(b);
    });
  }
  let hangarFrom = 'menu';
  function openHangar(from) { audio(); hangarFrom = from; renderHangar(); $('hangar').classList.remove('hidden'); }
  $('hangarBtn').addEventListener('click', () => openHangar('menu'));
  $('hangarBtn2').addEventListener('click', () => openHangar('over'));
  $('hangarBack').addEventListener('click', () => { $('hangar').classList.add('hidden'); refreshBank(); });
  $('missBtn').addEventListener('click', () => { audio(); renderMissions(); $('missions').classList.remove('hidden'); });
  $('missBack').addEventListener('click', () => $('missions').classList.add('hidden'));

  // ---------- Oficina entre fases ----------
  const UPGRADES = [
    { id: 'dmg', ico: '💥', max: 8, cost: l => 30 + l * 25, lvl: () => ups.dmg, buy: () => ups.dmg++ },
    { id: 'rate', ico: '⚡', max: 6, cost: l => 30 + l * 25, lvl: () => ups.rate, buy: () => ups.rate++ },
    { id: 'power', ico: '🔫', max: 5, cost: l => 40 + l * 20, lvl: () => ups.power, buy: () => ups.power++ },
    { id: 'mis', ico: '🚀', max: 3, cost: l => 60 + l * 40, lvl: () => ups.missiles, buy: () => ups.missiles++ },
    { id: 'shield', ico: '🛡️', max: 3, cost: () => 40, lvl: () => ups.shield, buy: () => ups.shield++ },
    { id: 'life', ico: '❤️', max: 6, cost: () => 80, lvl: () => ups.lives, buy: () => ups.lives++ },
    { id: 'bomb', ico: '💣', max: 5, cost: () => 35, lvl: () => ups.bombs, buy: () => ups.bombs++ }
  ];
  function renderUps() {
    refreshBank();
    $('doubleBtn').textContent = t('double', { n: stageCrystals });
    refreshAdButtons();
    const box = $('ups'); box.innerHTML = '';
    UPGRADES.forEach(u => {
      const l = u.lvl(), maxed = l >= u.max, cost = u.cost(l);
      const [nm, ds] = t('up')[u.id];
      const b = document.createElement('button');
      b.className = 'up' + (maxed ? ' max' : save.bank < cost ? ' off' : '');
      b.innerHTML = `<b>${u.ico}</b><span>${nm} ${['life', 'bomb', 'shield'].includes(u.id) ? '(' + l + ')' : t('lv') + ' ' + l}</span><small>${ds}</small><em>${maxed ? t('maxed') : '💎 ' + cost}</em>`;
      b.addEventListener('click', () => {
        if (maxed || !spend(cost)) { tone(150, 0.15, 'sawtooth', 0.03); return; }
        u.buy(); tone(660, 0.08, 'square', 0.04, 1320); renderUps();
      });
      box.appendChild(b);
    });
  }
  function openUpgrade() {
    if (state !== 'play') return;
    state = 'upgrade'; setTrack('menu'); persist();
    mission('score', score, true);
    const lastSt = stage === STAGES.length - 1;
    $('upTitle').textContent = lastSt ? t('saved') : t('bossDown');
    $('upSub').textContent = lastSt ? t('savedSub') : t('nextSub', { n: stage + 2, s: t('stages')[stage + 1] });
    renderUps();
    $('upgrade').classList.remove('hidden');
  }
  $('doubleBtn').addEventListener('click', () => {
    showAd('rewarded', () => {
      save.bank += stageCrystals; runCrystals += stageCrystals; doubled = true; persist();
      toast(t('doubleOk')); [784, 988, 1175].forEach((f, i) => setTimeout(() => tone(f, 0.1, 'square', 0.04), i * 80));
      renderUps();
    });
  });
  $('nextBtn').addEventListener('click', () => {
    $('upgrade').classList.add('hidden');
    stage++; if (stage >= STAGES.length) { stage = 0; loop++; }
    mission('stage', stage + 1 + loop * 5, true);
    state = 'play'; startStage(); setTrack('s' + stage);
  });

  // ---------- Fim de jogo / continuar ----------
  function gameOver() {
    state = 'over'; setTrack(null); jingle([64, 62, 60, 59, 55, 52], 0.18, 'triangle');
    mission('score', score, true); persist();
    const isBest = score > best;
    if (isBest) { best = score; try { localStorage.setItem('patrulhaBest', String(best)); } catch (e) {} }
    $('finalScore').textContent = score;
    $('overInfo').textContent = t('reached', { n: stage + 1, h: loop ? t('hard', { n: loop }) : '', s: ST().nome });
    $('bestOver').innerHTML = isBest ? `<b style="color:#ffd740">${t('newBest')}</b>` : t('best') + ': ' + best;
    $('earnedLine').textContent = runCrystals ? t('earned', { n: runCrystals }) : '';
    $('bestMenu').textContent = best;
    refreshBank(); refreshAdButtons();
    $('over').classList.remove('hidden');
  }
  $('reviveBtn').addEventListener('click', () => {
    showAd('rewarded', () => {
      revived = true; $('over').classList.add('hidden');
      ups.lives = 1; P.inv = 3; eBullets = []; state = 'play'; paused = false;
      enemies.forEach(e => { if (dist2(e.x, e.y, P.x, P.y) < 150 * 150) e.dead = true; });
      curName = ''; setTrack(boss ? 'boss' : 's' + stage);
      toast(t('reviveOk'));
    });
  });
  function play(opts) {
    audio();
    ['menu', 'over', 'hangar', 'missions'].forEach(id => $(id).classList.add('hidden'));
    particles = []; ambient = []; newGame(); state = 'play'; paused = false; curName = ''; setTrack('s0');
    tutMoved = 0; tutStep = 0;
    if (opts && opts.boost) { ups.power = Math.max(ups.power, 3); setTimeout(() => toast(t('boostOk')), 300); }
    refreshAdButtons();
    tone(330, 0.15, 'square', 0.04, 660); setTimeout(() => tone(660, 0.2, 'square', 0.04, 1320), 150);
  }
  $('playBtn').addEventListener('click', () => play());
  $('againBtn').addEventListener('click', () => maybeMidgame(() => play()));
  $('boostBtn').addEventListener('click', () => { audio(); showAd('rewarded', () => play({ boost: true })); });
  $('menuBtn').addEventListener('click', () => {
    $('over').classList.add('hidden'); state = 'menu'; setTrack('menu');
    refreshBank(); refreshBadge(); $('menu').classList.remove('hidden');
  });
  $('langBtn').addEventListener('click', () => {
    lang = lang === 'pt' ? 'en' : 'pt'; try { localStorage.setItem('patrulhaLang', lang); } catch (e) {}
    applyLang(); refreshSettings();
  });

  // ---------- Ajuste de som e vibração ----------
  let pausedBySettings = false;
  function refreshSettings() {
    $('musRange').value = Math.round(Math.min(100, vol.music / 1.1 * 100));
    $('musVal').textContent = $('musRange').value + '%';
    $('sfxRange').value = Math.round(vol.sfx * 100);
    $('sfxVal').textContent = $('sfxRange').value + '%';
    $('muteBtn').textContent = muted ? t('unmute') : t('mute');
    $('vibBtn').textContent = save.vib ? t('vibOn') : t('vibOff');
  }
  function openSettings() {
    audio();
    if (state === 'play' && !paused) { paused = true; pausedBySettings = true; }
    refreshSettings();
    $('settings').classList.remove('hidden');
  }
  function closeSettings() {
    $('settings').classList.add('hidden');
    if (pausedBySettings) { paused = false; pausedBySettings = false; }
  }
  function saveVol() { try { localStorage.setItem('patrulhaVol', JSON.stringify(vol)); } catch (e) {} }
  $('musRange').addEventListener('input', e => { vol.music = e.target.value / 100 * 1.1; if (muted && e.target.value > 0) setMute(false); applyVol(); saveVol(); refreshSettings(); });
  $('sfxRange').addEventListener('input', e => { vol.sfx = e.target.value / 100; if (muted && e.target.value > 0) setMute(false); applyVol(); saveVol(); refreshSettings(); });
  $('sfxRange').addEventListener('change', () => { tone(880, 0.08, 'square', 0.05, 1320); boom(0.25, 0.4); });
  $('muteBtn').addEventListener('click', () => { setMute(!muted); refreshSettings(); });
  $('vibBtn').addEventListener('click', () => { save.vib = !save.vib; persist(); refreshSettings(); vib(80); });
  $('setBack').addEventListener('click', closeSettings);
  ['setBtn1', 'setBtn2', 'setBtn3'].forEach(id => $(id).addEventListener('click', openSettings));
  $('setBtn1').addEventListener('click', () => { if (!curTrack) setTrack('menu'); });

  // ---------- Início ----------
  applyLang(); refreshBank(); ensureMissions(); refreshBadge(); refreshSettings();
  try { window.CrazyGames && window.CrazyGames.SDK && window.CrazyGames.SDK.game && window.CrazyGames.SDK.game.loadingStart && window.CrazyGames.SDK.game.loadingStart(); } catch (e) {}
  initSDK();
  setTimeout(checkDaily, 400);

  // ---------- Loop ----------
  particles = []; floaters = [];
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05;
    update(dt); draw(); syncGameplay();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
